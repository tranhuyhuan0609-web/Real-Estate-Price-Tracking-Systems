# Local infrastructure. Run from the repository root:
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
# Every port is bound to 127.0.0.1: nothing is reachable from other machines.

# Fixed project name: volume names derive from it (see docs/naming.md).
name: real-estate-price-tracking-systems

services:
  kafka:
    # KRaft mode: the broker is also its own controller, so no ZooKeeper container.
    image: apache/kafka:3.7.0
    restart: unless-stopped
    hostname: kafka
    ports:
      - 127.0.0.1:${KAFKA_HOST_PORT:-17100}:9092
    environment:
      CLUSTER_ID: 1NQ5N8lISF25WqJ-VHXLsA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers on the compose network, EXTERNAL for tools on the host.
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-17100}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker: internal topics cannot be replicated (development only).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-setup, never by a typo in a producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-setup:
    # One-shot job: create the pipeline topics once the broker is healthy, then exit.
    image: apache/kafka:3.7.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-Property_data.raw_events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-Property_data.dlq_events}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$KAFKA_RAW_TOPIC" --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$KAFKA_DLQ_TOPIC" --partitions 2 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list

volumes:
  kafka_data:
